services:
  vasilyok-db:
    image: postgres:18-alpine
    container_name: vasilyok-db
    environment:
      POSTGRES_DB: vasilyok
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vasilyok_secret
    volumes:
      - vasilyok_pgdata:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vasilyok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vasilyok-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vasilyok-app
    depends_on:
      vasilyok-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  vasilyok_pgdata:
