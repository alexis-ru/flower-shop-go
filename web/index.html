<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Василёк — Магазин цветов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="vasilyok-header">
        <div class="header-left">
            <span class="shop-name">🌸 Василёк</span>
        </div>
        <nav class="header-menu">
            <a href="/">Главная</a>
        </nav>
    </header>

    <main class="d-flex align-items-center justify-content-center" style="min-height:70vh">
        <div class="card shadow" style="width:400px">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Вход в систему</h3>
                <div id="loginError" class="alert alert-danger d-none"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-control" id="login" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <p class="text-muted text-center mt-3 mb-0 small">
                    Директор по умолчанию: <strong>director</strong> / <strong>admin123</strong>
                </p>
            </div>
        </div>
    </main>

    <footer class="vasilyok-footer">
        <div class="footer-weather" id="footerWeather">
            <small>Загрузка погоды…</small>
        </div>
        <div class="footer-currencies" id="footerCurrencies">
            <small>Загрузка курсов валют…</small>
        </div>
    </footer>

    <script src="/js/app.js"></script>

</body>
</html>
