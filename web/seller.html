<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Василёк — Личный кабинет продавца</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="vasilyok-header">
        <div class="header-left">
            <span class="shop-name">🌸 Василёк</span>
        </div>
        <nav class="header-menu">
            <span id="userName" class="me-3"></span>
            <a href="#" id="logoutBtn">Выйти</a>
        </nav>
    </header>

    <main class="container-fluid py-4">
        <div class="d-flex justify-content-between mb-3">
            <h5>Мои цветы</h5>
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addFlowerModal">+ Добавить</button>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr><th>ID</th><th>Наименование</th><th>Количество</th><th>Поступление</th><th>Продажа</th><th>Действия</th></tr>
                </thead>
                <tbody id="sellerFlowersTable"></tbody>
            </table>
        </div>
    </main>

    <!-- Add Flower Modal -->
    <div class="modal fade" id="addFlowerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить цветок</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Наименование</label>
                        <input type="text" class="form-control" id="flowerName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Количество</label>
                        <input type="number" class="form-control" id="flowerQty" value="1" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата поступления</label>
                        <input type="date" class="form-control" id="flowerArrival">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="addFlowerBtn">Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sale Date Modal -->
    <div class="modal fade" id="saleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Оформить продажу</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Дата продажи</label>
                        <input type="date" class="form-control" id="saleDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveSaleBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="vasilyok-footer">
        <div class="footer-weather" id="footerWeather"><small>Загрузка погоды…</small></div>
        <div class="footer-currencies" id="footerCurrencies"><small>Загрузка курсов валют…</small></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/seller.js"></script>
<!-- Сделал Шипулин Алексей-->
</body>
</html>
